<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50"><title>野球選手向け 目標設定ワーク</title>
<style>
:root{--navy:#102b50;--blue:#245d9b;--gold:#ffd34e;--muted:#5c6b7a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e4edf6,#f7f9fb);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--navy);line-height:1.55}
main{max-width:680px;margin:0 auto;padding:18px 14px 32px}.hero{background:var(--navy);color:white;border-radius:20px;padding:24px 20px;margin-bottom:16px}
.kicker{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;padding:4px 10px;border-radius:6px;font-size:13px}
h1{font-size:clamp(27px,7vw,38px);line-height:1.2;margin:12px 0 8px}.hero p{margin:0;color:#e7eef8}
.card{background:white;border:1px solid #d7e1ec;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 14px #102b500b}
.step{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:19px;font-weight:800}.num{display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:white;font-size:16px}
label{display:block;font-weight:700;margin:8px 0}.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
input,textarea,select{width:100%;font:inherit;color:#142d4a;background:#fbfdff;border:1.5px solid #c8d7e8;border-radius:11px;padding:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #245d9b20}textarea{resize:vertical;min-height:82px}
.actions{display:grid;grid-template-columns:1fr;gap:9px;margin:18px 0}button{border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:var(--gold);color:var(--navy)}
#result{display:none;white-space:pre-wrap;background:#fffdf3;border:2px solid var(--gold);border-radius:14px;padding:16px;margin-top:12px}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media(min-width:520px){.actions{grid-template-columns:1fr 1fr}}
</style></head>
<body><main>
<header class="hero"><span class="kicker">野球選手向け</span><h1>目標設定ワーク</h1><p>目標を「毎日の行動」につなげて、成長につなげよう！</p></header>
<form id="goalForm">
<section class="card"><h2 class="step"><span class="num">1</span>目標を決める</h2><label for="goal">どんな選手になりたい？</label><p class="hint">できるだけ具体的に書こう。</p><textarea id="goal" placeholder="例：球速130km/hを達成したい" required></textarea></section>
<section class="card"><h2 class="step"><span class="num">2</span>期限を決める</h2><label for="deadline">いつまでに達成したい？</label><select id="deadline" required><option value="">選んでください</option><option>1か月以内</option><option>3か月以内</option><option>6か月以内</option><option>1年以内</option><option>その他（下の欄に記入）</option></select><label for="customDeadline">具体的な日付・期限（任意）</label><input id="customDeadline" placeholder="例：2027年3月末まで"></section>
<section class="card"><h2 class="step"><span class="num">3</span>今の課題を考える</h2><label for="challenge">目標達成のために、何が必要？</label><textarea id="challenge" placeholder="例：体の使い方を改善する"></textarea></section>
<section class="card"><h2 class="step"><span class="num">4</span>毎日の行動を決める</h2><label for="action">明日から何をする？</label><textarea id="action" placeholder="例：練習前に10分間、動作改善に取り組む" required></textarea></section>
<section class="card"><h2 class="step"><span class="num">5</span>振り返りの基準</h2><label for="measure">何ができたら前進と言える？</label><textarea id="measure" placeholder="例：週3回取り組めたか記録する"></textarea></section>
<div class="actions"><button type="button" class="primary" id="copyBtn">回答をまとめてコピー</button><button type="reset" class="secondary">入力内容をリセット</button></div>
</form><div id="result" role="status" aria-live="polite"></div><p class="note">このワークは目標を整理するためのものです。無理のない目標と行動を設定し、定期的に見直しましょう。</p>
</main>
<script>
const $=id=>document.getElementById(id);
function makeText(){const d=$('deadline').value,c=$('customDeadline').value.trim();return ['【野球選手 目標設定ワーク】','① 目標：'+$('goal').value.trim(),'② 期限：'+(d||'未入力')+(c?'（'+c+'）':''),'③ 今の課題：'+($('challenge').value.trim()||'未入力'),'④ 毎日の行動：'+$('action').value.trim(),'⑤ 振り返りの基準：'+($('measure').value.trim()||'未入力')].join('\n')}
$('copyBtn').addEventListener('click',async()=>{if(!$('goal').value.trim()||!$('action').value.trim()||!$('deadline').value){$('result').style.display='block';$('result').textContent='「目標」「期限」「毎日の行動」を入力してください。';return}const t=makeText();try{await navigator.clipboard.writeText(t);$('result').style.display='block';$('result').textContent='回答をコピーしました！メモなどに貼り付けて保存してください。\n\n'+t}catch(e){$('result').style.display='block';$('result').textContent='下の回答を長押ししてコピーしてください。\n\n'+t}});
$('goalForm').addEventListener('reset',()=>setTimeout(()=>{$('result').style.display='none';$('result').textContent=''},0));
</script></body></html>
